default: &default
  database: <%= Rails.env %>
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    max_age: <%= 1.week.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
